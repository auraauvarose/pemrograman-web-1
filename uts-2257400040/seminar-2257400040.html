<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Formulir Pendaftaran Seminar</title>
  <!-- Soal 2: CSS eksternal -->
  <link rel="stylesheet" href="seminar-2257400040.css">
</head>
<body>

  <!-- Soal 2 - Formulir Pendaftaran Seminar
       Nama: R. Aura Auvarose Endica Saebani
       NIM : 2257400040 -->

  <h1>Pendaftaran Peserta Seminar Teknologi Informasi</h1>

  <form action="#" method="post">

    <fieldset>
      <legend>Data Pribadi</legend>

      <p>
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required>
      </p>

      <p>
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" required>
      </p>

      <p>
        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="telepon">Nomor Telepon</label>
        <input type="tel" id="telepon" name="telepon" required>
      </p>

      <p>
        <label for="usia">Usia</label>
        <input type="number" id="usia" name="usia" min="1" max="100">
      </p>

      <p>
        <label>Jenis Kelamin</label>
        <input type="radio" id="lk" name="jenis_kelamin" value="Laki-laki" required>
        <label for="lk">Laki-laki</label>
        <input type="radio" id="pr" name="jenis_kelamin" value="Perempuan">
        <label for="pr">Perempuan</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Data Akademik dan Seminar</legend>

      <p>
        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi" required>
          <option value="">-- Pilih Program Studi --</option>
          <option value="Informatika">Informatika</option>
          <option value="Sistem Informasi">Sistem Informasi</option>
          <option value="Sistem Komputer">Sistem Komputer</option>
          <option value="Teknologi Informasi">Teknologi Informasi</option>
        </select>
      </p>

      <p>
        <label for="kategori">Kategori Seminar</label>
        <select id="kategori" name="kategori">
          <option value="">-- Pilih Kategori Seminar --</option>
          <option value="Kecerdasan Buatan">Kecerdasan Buatan</option>
          <option value="Keamanan Siber">Keamanan Siber</option>
          <option value="Pengembangan Web">Pengembangan Web</option>
          <option value="Data Science">Data Science</option>
        </select>
      </p>

      <p>
        <label for="alasan">Alasan Mengikuti Seminar</label>
        <textarea id="alasan" name="alasan" rows="4" cols="40"></textarea>
      </p>
    </fieldset>

    <p>
      <button type="submit">Daftar</button>
      <button type="reset">Reset</button>
    </p>

  </form>

</body>
</html>
